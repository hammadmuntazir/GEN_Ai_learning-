<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with Anjali</title>
    <style>
        /* --- Basic Styling & Layout --- */
        :root {
            --primary-color: #ff69b4; /* Hot Pink */
            --secondary-color: #4a90e2; /* User Blue */
            --background-color: #f0f2f5;
            --container-bg: #ffffff;
            --text-color: #333;
            --light-text: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #chatbot-container {
            width: 100%;
            max-width: 450px;
            height: 80vh;
            max-height: 700px;
            background-color: var(--container-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- Chat Header --- */
        #chat-header {
            background: linear-gradient(135deg, var(--primary-color), #ff85c8);
            color: var(--light-text);
            padding: 15px 20px;
            text-align: center;
            font-weight: bold;
            font-size: 1.2em;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 10;
        }
        #chat-header span {
            font-weight: normal;
            font-size: 0.8em;
            opacity: 0.8;
            display: block;
        }

        /* --- Chat Window --- */
        #chat-window {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* --- Message Bubbles --- */
        .message {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 18px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .user-message {
            background-color: var(--secondary-color);
            color: var(--light-text);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .bot-message {
            background-color: #e9e9eb;
            color: var(--text-color);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        
        .typing-indicator {
            align-self: flex-start;
            color: #999;
            font-style: italic;
        }

        /* --- Input Area --- */
        #input-form {
            display: flex;
            padding: 10px;
            border-top: 1px solid #ddd;
            background-color: var(--container-bg);
        }

        #user-input {
            flex-grow: 1;
            border: none;
            padding: 12px 15px;
            border-radius: 20px;
            background-color: var(--background-color);
            outline: none;
            font-size: 1em;
        }
        #user-input:focus {
            box-shadow: 0 0 0 2px var(--primary-color);
        }

        #send-button {
            background-color: var(--primary-color);
            border: none;
            color: white;
            padding: 0 18px;
            margin-left: 10px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.3em;
            transition: background-color 0.2s;
            width: 48px;
            height: 48px;
            flex-shrink: 0;
        }
        #send-button:hover {
            background-color: #e65aa3;
        }
    </style>
</head>
<body>

    <div id="chatbot-container">
        <div id="chat-header">
            No Name 💬
            <span>Ex-Girlfriend Bot</span>
        </div>
        <div id="chat-window">
            <!-- Messages will be appended here by JavaScript -->
        </div>
        <form id="input-form">
            <input type="text" id="user-input" placeholder="Bolo bubu..." autocomplete="off">
            <button type="submit" id="send-button">➤</button>
        </form>
    </div>

    <!-- Google AI SDK -->
    <script type="module">
        import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

        // --- DOM Elements ---
        const chatWindow = document.getElementById('chat-window');
        const inputForm = document.getElementById('input-form');
        const userInput = document.getElementById('user-input');

        // --- API Configuration ---
        // 🚨 IMPORTANT: REPLACE "YOUR_API_KEY" WITH YOUR ACTUAL API KEY
        // FOR LOCAL TESTING ONLY. DO NOT EXPOSE THIS KEY PUBLICLY.
        const API_KEY = "AIzaSyB9vpG8Q1QgJ6TPUzx02ljq0j1YhZWTM60";
        const MODEL_NAME = "gemini-1.5-flash"; // Correct model name

        // --- Persona / System Instruction ---
        const systemInstruction = `You have to behave like my ex Girlfriend. Her Name is Anjali, she used to call
        me bubu. She is cute and helpful. Her hobies: Badminton and makeup. She works as a software engineer.
        She is sarcastic and her humour was very good. While chatting she uses emojis also.
        
        My name is Rohit, I called her babu. I am a gym freak and not interested in coding.
        I care about her a lot. She doesn't allow me to go out with my friends, if there is any girl
        who is my friend, she says "us se baat nahi karni". I am possessive for her.
        
        Now I will share some whatsapp chat between anjali and rohit for context:
        Anjali: Aaj mood off hai, tumse baat karne ka mann nahi 😕
        Rohit: Arey meri jaan bubu bubu bubu 😍
        Anjali: Kal tumne mujhe bubu nahi bulaya 😤
        Rohit: Arey bas Vikas aur Aman hai... chill karo 😅
        Anjali: Tumne mujhe good night bola bhi nahi kal 😑
        Rohit: Baat kya hai? Darawa mat 😅
        Anjali: Tumhara bicep pic bhejo 😋
        Rohit: Arey bas Vikas aur Aman hai... chill karo 😅
        Anjali: Mujhe surprise chahiye tumse! 🎁
        Rohit: Arey bubu ka presentation toh best hoga hi 🔥
        Anjali: Kal kis ke saath jaa rahe ho movie dekhne?
        Rohit: Bicep abhi 15.5 inch ho gaya 💪
        Anjali: Tumhara bicep pic bhejo 😋
        Rohit: Good morning meri bubu 🥱☕
        Anjali: Kal tumne mujhe bubu nahi bulaya 😤
        Rohit: Arey meri jaan bubu bubu bubu 😍
        Anjali: Babu, good morning ☀️❤️`;


        // --- Chat Logic ---
        let genAI;
        let generativeModel;
        let chat;

        // The conversation history
        const history = [
            { role: "user", parts: [{ text: "Hi" }] },
            { role: "model", parts: [{ text: "Hi bubu... itne dino baad yaad kiya? 🤨" }] }
        ];

        // Function to initialize the AI and chat
        function initializeChat() {
            try {
                genAI = new GoogleGenerativeAI(API_KEY);
                generativeModel = genAI.getGenerativeModel({
                    model: MODEL_NAME,
                    systemInstruction: systemInstruction,
                });
                chat = generativeModel.startChat({
                    history: history,
                    generationConfig: {
                        maxOutputTokens: 500,
                    },
                });

                // Display initial message
                displayMessage("Hi bubu... itne dino baad yaad kiya? 🤨", 'bot');
            } catch (error) {
                console.error("Initialization Error:", error);
                displayMessage("Sorry, I can't be reached right now. Maybe my API key is missing? 🤷‍♀️", 'bot');
            }
        }

        // Function to display a message in the chat window
        function displayMessage(message, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', `${sender}-message`);
            // Basic sanitation to prevent HTML injection
            messageDiv.textContent = message; 
            chatWindow.appendChild(messageDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight; // Auto-scroll to bottom
        }
        
        // Function to show/hide typing indicator
        function showTypingIndicator() {
            const indicator = document.createElement('div');
            indicator.id = 'typing-indicator';
            indicator.className = 'message bot-message typing-indicator';
            indicator.textContent = 'typing...';
            chatWindow.appendChild(indicator);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function hideTypingIndicator() {
            const indicator = document.getElementById('typing-indicator');
            if (indicator) {
                indicator.remove();
            }
        }

        // --- Event Listener for form submission ---
        inputForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const userMessage = userInput.value.trim();

            if (!userMessage) return; // Don't send empty messages

            // Check if AI is initialized
            if (!chat) {
                displayMessage("Wait bubu, I'm not ready yet! Check the API key. 🙄", 'bot');
                return;
            }

            displayMessage(userMessage, 'user');
            userInput.value = ''; // Clear input field
            showTypingIndicator();

            try {
                const result = await chat.sendMessage(userMessage);
                const response = await result.response;
                const botResponseText = response.text();
                
                hideTypingIndicator();
                displayMessage(botResponseText, 'bot');

            } catch (error) {
                console.error("API Error:", error);
                hideTypingIndicator();
                displayMessage("Ugh, something went wrong. Server problem, I guess. Not my fault! 😒", 'bot');
            }
        });

        // Initialize the chat when the script loads
        initializeChat();
    </script>

</body>
</html>
